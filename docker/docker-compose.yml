version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: imrbs-postgres
    environment:
      POSTGRES_DB: imrbs
      POSTGRES_USER: imrbs_user
      POSTGRES_PASSWORD: imrbs_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=zh_TW.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - imrbs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imrbs_user -d imrbs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: imrbs-redis
    command: redis-server --requirepass imrbs_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - imrbs-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: imrbs-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: imrbs_user
      RABBITMQ_DEFAULT_PASS: imrbs_pass
      RABBITMQ_DEFAULT_VHOST: /imrbs
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - imrbs-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  imrbs-network:
    driver: bridge
