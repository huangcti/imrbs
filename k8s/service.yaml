apiVersion: v1
kind: Service
metadata:
  name: imrbs-backend-service
  namespace: imrbs
  labels:
    app.kubernetes.io/name: imrbs
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: imrbs
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: imrbs-frontend-service
  namespace: imrbs
  labels:
    app.kubernetes.io/name: imrbs
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: imrbs
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: imrbs-ingress
  namespace: imrbs
  labels:
    app.kubernetes.io/name: imrbs
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - imrbs.example.com
      secretName: imrbs-tls-secret
  rules:
    - host: imrbs.example.com
      http:
        paths:
          # 前端靜態資源
          - path: /
            pathType: Prefix
            backend:
              service:
                name: imrbs-frontend-service
                port:
                  number: 80
          # 後端 API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: imrbs-backend-service
                port:
                  number: 8080
          # Actuator 端點 (需限制存取)
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: imrbs-backend-service
                port:
                  number: 8080
