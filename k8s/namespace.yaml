apiVersion: v1
kind: Namespace
metadata:
  name: imrbs
  labels:
    app.kubernetes.io/name: imrbs
    app.kubernetes.io/part-of: imrbs
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: imrbs-quota
  namespace: imrbs
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: imrbs-limits
  namespace: imrbs
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      type: Container
