name: Frontend CI

on:
  push:
    branches: [ main, master, 'feature/**', '0**-**' ]
    paths:
      - 'imrbs-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'imrbs-frontend/**'

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: imrbs-frontend/package-lock.json

      - name: Install dependencies
        working-directory: imrbs-frontend
        run: npm ci

      - name: Run linter
        working-directory: imrbs-frontend
        run: npm run lint

      - name: Run type check
        working-directory: imrbs-frontend
        run: npm run build

      - name: Run unit tests
        working-directory: imrbs-frontend
        run: npm run test:unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./imrbs-frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: imrbs-frontend/package-lock.json

      - name: Install dependencies
        working-directory: imrbs-frontend
        run: npm ci

      - name: Build for production
        working-directory: imrbs-frontend
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imrbs-frontend
          path: imrbs-frontend/dist
          retention-days: 30
