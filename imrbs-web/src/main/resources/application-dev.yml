spring:
  config:
    activate:
      on-profile: dev

  # Database
  datasource:
    url: jdbc:postgresql://localhost:5432/imrbs
    username: imrbs_user
    password: imrbs_pass

  # Cache (開發環境使用 simple cache 而非 Redis)
  cache:
    type: simple

  # Redis (開發環境暫時禁用)
  data:
    redis:
      repositories:
        enabled: false

  # RabbitMQ (開發環境暫時禁用)
  # rabbitmq:
  #   host: localhost
  #   port: 5672
  #   username: imrbs_user
  #   password: imrbs_pass
  #   virtual-host: /imrbs
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

  # JPA
  jpa:
    show-sql: true

logging:
  level:
    tw.huangcti.imrbs: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
