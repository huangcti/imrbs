server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: imrbs

  profiles:
    active: dev
  
  main:
    allow-bean-definition-overriding: true

  # Database Configuration
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

  # Redis Configuration
  data:
    redis:
      repositories:
        enabled: false

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour

  # RabbitMQ Configuration
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

  # Session Configuration
  session:
    timeout: 8h
    store-type: redis

  # OAuth 2.0 / OIDC Configuration
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OAUTH2_CLIENT_ID:imrbs-client}
            client-secret: ${OAUTH2_CLIENT_SECRET:dev-secret-not-used}
            redirect-uri: "{baseUrl}/auth/callback"
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/imrbs}
            token-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/imrbs}/protocol/openid-connect/token
            authorization-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/imrbs}/protocol/openid-connect/auth
            user-info-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/imrbs}/protocol/openid-connect/userinfo
            jwk-set-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/imrbs}/protocol/openid-connect/certs

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-key-for-local-development-only-minimum-32-characters}
  expiration: 900 # 15 minutes (秒)
  refresh-expiration: 86400 # 24 hours (秒)
  issuer: imrbs-api
  audience: imrbs-web

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    tw.huangcti.imrbs: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  packages-to-scan: tw.huangcti.imrbs.web.controller
  pathsToMatch: /api/v1/**

# Application Configuration
app:
  name: IMRBS
  version: 1.0.0
  description: 會議室預約系統 - Integrated Meeting Room Booking System
